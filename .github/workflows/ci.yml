name: internal-mechanics
on:
  pull_request:
  push:
    branches: [main]

jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_internal_*.py' -v
